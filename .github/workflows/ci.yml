name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  GOWORK: "off"
  GOFLAGS: "-mod=readonly"
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: make fmt-check vet
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --config .golangci.yml ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --config .golangci.yml --build-tags onnx ./...
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Install pinned runtime for contextual integration fixture
        shell: bash
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-linux-x64-1.22.0.tgz \
            -o "$RUNNER_TEMP/context-ort.tgz"
          echo '8344d55f93d5bc5021ce342db50f62079daf39aaafb5d311a451846228be49b3  '"$RUNNER_TEMP/context-ort.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/context-ort.tgz" -C "$RUNNER_TEMP"
          echo "SAIFETY_CONTEXT_TEST_LIBRARY=$RUNNER_TEMP/onnxruntime-linux-x64-1.22.0/lib/libonnxruntime.so.1.22.0" >> "$GITHUB_ENV"
      - run: make ci-test
  state-portability:
    name: state (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 -timeout=3m ./internal/policy ./internal/hook ./internal/mcp ./internal/cli
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: make ci-build
